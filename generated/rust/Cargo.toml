[package]
name = "cliptown-interfaces-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cliptown/cliptown-interfaces"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v7"] }
serde_json = "1"
