syntax = "proto3";

package cliptown;

message ClipboardItem {
  string id = 1;
  bytes encrypted_data = 2; // AES-256-GCM ciphertext
  bytes initialization_vector = 3; // IV / Nonce used for encryption
  int64 timestamp = 4;
  bool is_pinned = 5;
}

message SyncRequest {
  string user_id = 1;
  int64 last_sync_time = 2;
}

message SyncResponse {
  repeated ClipboardItem items = 1;
}

service ClipboardSyncService {
  rpc Sync(SyncRequest) returns (SyncResponse);
}
