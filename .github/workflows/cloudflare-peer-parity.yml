name: Cloudflare peer Rust/Dart/TypeScript parity
on:
  pull_request:
    paths:
      - 'fixtures/cloudflare-text-cache-v1.json'
      - 'json-schema/cloudflare-peer-signal-v1.schema.json'
      - 'docs/cloudflare-peer-first.md'
      - 'generated/rust/src/cloud_cache.rs'
      - 'generated/rust/src/lib.rs'
      - 'generated/typescript/src/cloudflare_cache.ts'
      - 'generated/typescript/src/index.ts'
      - 'generated/dart/lib/src/cloudflare_cache.dart'
      - 'generated/dart/lib/cliptown_interfaces.dart'
      - 'generated/dart/tool/cloud_cache_contract_test.dart'
      - 'tests/cloudflare-cache-parity.test.mjs'
      - '.github/workflows/cloudflare-peer-parity.yml'
  push:
    branches: [main]
    paths:
      - 'fixtures/cloudflare-text-cache-v1.json'
      - 'json-schema/cloudflare-peer-signal-v1.schema.json'
      - 'generated/**/cloudflare_cache.*'
      - '.github/workflows/cloudflare-peer-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head proof
        env: {EXPECTED_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path generated/rust/Cargo.toml --check
      - run: cargo test --manifest-path generated/rust/Cargo.toml --locked --all-targets
      - run: cargo clippy --manifest-path generated/rust/Cargo.toml --locked --all-targets -- -D warnings
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head proof
        env: {EXPECTED_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22.16.0'}
      - working-directory: generated/typescript
        run: npm ci && npm run typecheck && npm run build
      - name: Actual compiled TypeScript vectors
        run: node --test tests/cloudflare-cache-parity.test.mjs
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head proof
        env: {EXPECTED_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
        with: {sdk: '3.12.2'}
      - name: Verify Dart SDK
        run: dart --version 2>&1 | grep -F 'Dart SDK version: 3.12.2'
      - working-directory: generated/dart
        run: dart pub get && dart analyze --fatal-infos --fatal-warnings && dart run tool/cloud_cache_contract_test.dart
