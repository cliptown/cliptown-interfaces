name: embedding-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out immutable TJSV tool
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 7241f8e52dcc4518c72f0fdb5152d6cf66c86656
          path: .ci/tjsv
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
      - name: Verify cross-artifact invariants
        run: node scripts/verify-embedding-contract.mjs
      - name: Run interface regression tests
        run: node --test tests/embedding-contract-regression.test.mjs
      - name: Compile Microsoft TypeSpec
        run: npx --yes --package @typespec/compiler@1.15.0 tsp compile embedding-contract/embeddings.tsp --no-emit
      - name: Enforce TypeSpec / JSON Schema peer-authority convergence
        uses: ./.ci/tjsv
        with:
          typespec: embedding-contract/embeddings.tsp
          schema: embedding-contract/embedding-record.schema.json
          report: .typespec-json-schema-validator/embedding-contract-report.json
          output_dir: .typespec-json-schema-validator/generated
          sarif: .typespec-json-schema-validator/embedding-contract-report.sarif
          quiet: false
      - name: Retain TJSV evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cliptown-embedding-tjsv-evidence
          path: .typespec-json-schema-validator/
          if-no-files-found: warn
          retention-days: 30
