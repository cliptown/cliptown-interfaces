name: embedding-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out immutable TJSV tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
          path: .ci/tjsv
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
      - name: Bootstrap immutable TJSV toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix .ci/tjsv
          npm rebuild --prefix .ci/tjsv @oresoftware/f2e --foreground-scripts
          node .ci/tjsv/bin/typespec-json-schema-validator.mjs doctor --quiet
          rm -rf node_modules
          ln -s "$PWD/.ci/tjsv/node_modules" node_modules
      - name: Verify cross-artifact invariants
        run: node scripts/verify-embedding-contract.mjs
      - name: Run interface regression tests
        run: node --test tests/embedding-contract-regression.test.mjs
      - name: Compile Microsoft TypeSpec with the pinned peer-authority toolchain
        run: ./node_modules/.bin/tsp compile embedding-contract/embeddings.tsp --no-emit
      - name: Enforce TypeSpec / JSON Schema peer-authority convergence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tjsv-evidence/generated
          set +e
          node .ci/tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=embedding-contract/embeddings.tsp \
            --schema=embedding-contract/embedding-record.schema.json \
            --report=tjsv-evidence/embedding-contract-report.json \
            --sarif=tjsv-evidence/embedding-contract-report.sarif \
            --output-dir=tjsv-evidence/generated \
            --seal-object-schemas=false \
            2>&1 | tee tjsv-evidence/tjsv.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Retain TJSV evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cliptown-embedding-tjsv-evidence
          path: tjsv-evidence/
          if-no-files-found: error
          retention-days: 30
