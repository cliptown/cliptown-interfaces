name: branch-tree-probe

on:
  push:
    branches:
      - agent/den-44-threefa-cliptown-bridge

permissions:
  contents: read

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print branch commit and tree
        run: |
          echo "commit=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse 'HEAD^{tree}')"
