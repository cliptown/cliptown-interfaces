name: interfaces-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Buf 1.72.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: "1.72.0"
      - name: Verify pinned Buf version
        run: test "$(buf --version)" = "1.72.0"
      - run: buf lint
      - name: Breaking-change check
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          if git cat-file -e origin/main:proto/cliptown/v1/common.proto 2>/dev/null; then
            buf breaking --against 'https://github.com/cliptown/cliptown-interfaces.git#branch=main'
          else
            echo 'main has no ClipTown v1 baseline yet; this PR establishes it.'
          fi
      - run: python3 scripts/check-wire-contract.py
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install pinned Spectral 6.15.0
        run: npm install --global @stoplight/spectral-cli@6.15.0
      - name: Verify pinned Spectral version
        run: test "$(spectral --version)" = "6.15.0"
      - run: spectral lint openapi/cliptown.openapi.yaml
      - name: Compile JSON Schemas with strict formats
        run: |
          for schema in json-schema/*.schema.json; do
            npx --yes --package ajv-cli --package ajv-formats ajv compile --spec=draft2020 -c ajv-formats -s "$schema" --strict=true
          done
  generated-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: test "$(rustc --version | awk '{print $2}')" = "1.88.0"
      - run: cargo fmt --manifest-path generated/rust/Cargo.toml --check
      - run: cargo clippy --manifest-path generated/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path generated/rust/Cargo.toml
  generated-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: generated/typescript
        run: npm install
      - working-directory: generated/typescript
        run: npm run typecheck && npm run build
  generated-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Verify pinned Dart version
        run: |
          dart --version 2>&1 | grep -F 'Dart SDK version: 3.12.2'
      - working-directory: generated/dart
        run: dart pub get && dart analyze
