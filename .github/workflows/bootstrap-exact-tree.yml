name: Bootstrap exact repository tree
on:
  push:
    branches: [agent/cliptown-strong-skeletons]
permissions:
  contents: write
concurrency:
  group: bootstrap-${{ github.repository }}
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
