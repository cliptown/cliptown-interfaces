[package]
org = "cliptown"
name = "cliptown-interfaces"
version = "0.1.0"
description = "Core Protobuf and OpenAPI schemas for the Cliptown ecosystem"
license = "MIT"
keywords = ["schema", "protobuf", "openapi", "clipboard"]

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-interfaces"

[publish]
include_readme = true
tag_format = "v{version}"

[targets.nodejs]
dir = "generated/typescript"
name = "cliptown-interfaces-nodejs"
adapter = "node"

[targets.dart]
dir = "generated/dart"
name = "cliptown-interfaces-dart"

[targets.rust]
dir = "generated/rust"
name = "cliptown-interfaces-rust"
