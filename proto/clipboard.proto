syntax = "proto3";

package cliptown;

message ClipboardItem {
  string id = 1;
  string content = 2;
  int64 timestamp = 3;
  bool is_pinned = 4;
}

message SyncRequest {
  string user_id = 1;
  int64 last_sync_time = 2;
}

message SyncResponse {
  repeated ClipboardItem items = 1;
}

service ClipboardSyncService {
  rpc Sync(SyncRequest) returns (SyncResponse);
}
