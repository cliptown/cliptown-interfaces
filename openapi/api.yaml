openapi: 3.0.0
info:
  title: Cliptown API
  version: 0.1.0
paths:
  /sync:
    get:
      summary: Sync clipboard items
      responses:
        '200':
          description: A list of clipboard items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClipboardItem'
components:
  schemas:
    ClipboardItem:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        timestamp:
          type: integer
        is_pinned:
          type: boolean
